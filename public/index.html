  function startSession(o) {

  function doLogin() {
    var em = document.getElementById('az-email'), pw = document.getElementById('az-pass'), btn = document.getElementById('az-lbtn');
    var email = String(em.value || '').trim().toLowerCase(), pass = String(pw.value || '');
    loginErr('');
    if (!/^[^@\s]+@[^@\s.]+\.[^@\s]+$/.test(email)) { loginErr('Enter a valid email address.'); em.focus(); return; }
    if (pass.length < 4) { loginErr('Enter your password.'); pw.focus(); return; }
    btn.disabled = true; btn.textContent = 'Signing in\u2026';
    sha256hex(pass, function (h) {
      btn.disabled = false; btn.textContent = 'Login';
      if (h === null) { loginErr('This browser blocks secure hashing \u2014 open the page over https.'); return; }
      var u = findUser(email);
      if (u && u.phash === h) {
        startSession({ e: u.email, r: u.role, n: u.name, i: u.idNum, at: Date.now() });
        return;
      }
      loginErr(u ? 'Wrong password for ' + u.email + '.'

    });
  }

  function val(x) {
    if (x === null || x === undefined) return null;
    if ('stringValue' in x) return x.stringValue;
    if ('integerValue' in x) return parseInt(x.integerValue, 10);
    if ('doubleValue' in x) return x.doubleValue;
    if ('booleanValue' in x) return x.booleanValue;
    if ('arrayValue' in x) { var a = x.arrayValue.values || [], o = []; for (var i = 0; i < a.length; i++) o.push(val(a[i])); return o; }
    if ('mapValue' in x) return unmap(x.mapValue.fields);
    if ('timestampValue' in x) return x.timestampValue;
    return null;
  }
  function unmap(f) { var o = {}; if (f) { for (var k in f) if (f.hasOwnProperty(k)) o[k] = val(f[k]); } return o; }
  function idOf(n) { var p = String(n).split('/'); return p[p.length - 1]; }
  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function fmt(n) {
    n = Number(n) || 0;
    if (n >= 1000000) return (n / 1000000).toFixed(1).replace('.0', '') + 'M';
    if (n >= 1000) return (n / 1000).toFixed(1).replace('.0', '') + 'K';
    return String(n);
  }
  function money(n) { return (Number(n) || 0).toLocaleString('en-US'); }
  function getJSON(url, cb) {
    try {
      fetch(url, { method: 'GET', headers: { Accept: 'application/json' } })
        .then(function (r) { return r.json(); })
        .then(function (d) { cb(null, d); })
        .catch(function (e) { cb(e, null); });
    } catch (e) { cb(e, null); }
  }
  function write(url, method, payload, cb) {
    try {
      fetch(url, { method: method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
        .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('http ' + r.status)); })
        .then(function (d) { cb && cb(null, d); })
        .catch(function (e) { cb && cb(e, null); });
    } catch (e) { cb && cb(e, null); }
  }
  function toast(t) {
    var el = document.getElementById('az-toast');
    if (!el) return;
    el.textContent = t; el.hidden = false;
    clearTimeout(toast._t); toast._t = setTimeout(function () { el.hidden = true; }, 2400);
  }
  function status(txt, ok) {
    var s = document.getElementById('az-status');

    s.textContent = txt;

  }

  function loadRooms() {
    getJSON(ROOMS + '?key=' + KEY + '&orderBy=idNum', function (err, data) {
      if (err || !data || !data.documents) { status('offline \u2014 retrying', false); return; }
      var list = [];
      for (var i = 0; i < data.documents.length; i++) {
        var d = data.documents[i], f = unmap(d.fields);
        f.docId = idOf(d.name);
        list.push(f);
      }
      st.rooms = list;
      status('live \u00b7 Firestore streaming', true);
      var on = document.getElementById('az-onsite');
      if (on) on.textContent = list.length;
      renderWallet();
      render();
      if (st.cur) {
        var found = null;
        for (var k = 0; k < list.length; k++) if (list[k].docId === st.cur) found = list[k];
        if (found) { st.cur = found.docId; renderStage(); }
      }
    });
  }

  function loadChat() {
    if (!st.cur) return;
    getJSON(ROOMS + '/' + st.cur + '/chat?pageSize=200&key=' + KEY, function (err, data) {
      var box = document.getElementById('az-chat');
      if (!box) return;
      if (err || !data || !data.documents) { box.innerHTML = '<div class="az-empty">Chat is quiet right now.</div>'; return; }
      var docs = data.documents.slice(0);
      docs.sort(function (a, b) {
        var ta = unmap(a.fields).createdAt || a.createTime || '';
        var tb = unmap(b.fields).createdAt || b.createTime || '';
        return String(ta) < String(tb) ? -1 : (String(ta) > String(tb) ? 1 : 0);
      });
      if (docs.length > 80) docs = docs.slice(docs.length - 80);
      var rows = '';
      for (var i = 0; i < docs.length; i++) {
        var f = unmap(docs[i].fields);
        if (!f.text) continue;
        var cls = f.isGift ? ' gift' : (f.isSystem ? ' sys' : '');
        var vip = f.vipLevel ? '<span class="az-vip">VIP ' + esc(f.vipLevel) + '</span>' : '';
        var who = f.isSystem ? '' : '<span class="az-who ' + (f.gender === 'MALE' ? 'm' : 'f') + '">' + vip + esc(f.user || 'guest') + ':</span>';
        var body = f.isGift ? (esc(f.giftIcon || '') + ' ' + esc(f.text)) : esc(f.text);
        rows += '<div class="az-m' + cls + '">' + who + '<span class="az-txt">' + body + '</span></div>';
      }
      box.innerHTML = rows || '<div class="az-empty">Say hello \u{1F44B}</div>';
      st.msgCount = docs.length;
      box.scrollTop = box.scrollHeight;
      var stat = document.getElementById('az-msgcount');
      if (stat) stat.textContent = st.msgCount;
    });
  }

  function sendChat(text, gift, price) {
    if (!st.cur || !text) return;
    if (price && price > st.coins) { toast('Not enough coins \u2014 open Top Up'); openWallet('topup'); return; }
    if (price) st.coins -= price;
    var fields = {
      user: { stringValue: ME.name },
      text: { stringValue: String(text).slice(0, 200) },
      gender: { stringValue: ME.gender },
      level: { integerValue: String(ME.level) },
      vipLevel: { integerValue: String(ME.vipLevel) },
      isSystem: { booleanValue: false },
      isGift: { booleanValue: !!gift },
      giftIcon: { stringValue: gift || '' },
      createdAt: { timestampValue: new Date().toISOString() }
    };
    var docId = 'w' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    write(ROOMS + '/' + st.cur + '/chat/' + docId + '?key=' + KEY, 'POST', { fields: fields }, function () { loadChat(); });
    if (price) bump('charmScore', price);
    var box = document.getElementById('az-chat');
    if (box) {
      var div = document.createElement('div');
      div.className = 'az-m' + (gift ? ' gift' : '');
      div.innerHTML = (gift ? '' : '<span class="az-who m">' + esc(ME.name) + ':</span>') +
        '<span class="az-txt">' + esc((gift ? gift + ' ' : '') + text) + '</span>';
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }
    renderWallet();
  }

  function bump(field, delta) {
    if (!st.cur) return;
    var r = roomById(st.cur) || {};
    var next = Math.max(0, (Number(r[field]) || 0) + delta);
    var p = {}; p[field] = { integerValue: String(next) };
    write(ROOMS + '/' + st.cur + '?key=' + KEY, 'PATCH',
      { fields: p, mask: { fieldPaths: [field] }, currentDocument: {} }, function () { loadRooms(); });
  }

  function boostPK() {
    var r = roomById(st.cur);

    var cost = 500;
    if (st.coins < cost) { toast('Need ' + cost + ' coins to boost'); openWallet('topup'); return; }
    st.coins -= cost; renderWallet();
    var next = (Number(r.pkBattle.leftScore) || 0) + cost;
    write(ROOMS + '/' + st.cur + '?key=' + KEY, 'PATCH',
      { fields: { pkBattle: { mapValue: { fields: { leftScore: { integerValue: String(next) } } } } },
        mask: { fieldPaths: ['pkBattle.leftScore'] }, currentDocument: {} }, function () { loadRooms(); });
    toast('Boosted PK with ' + cost + ' pts \u{1F525}');
  }

    st.coins += win; renderWallet();

  // event wiring (delegated, survives re-render)

  (function wireLogin() {

    if (fa) fa.addEventListener('click', function () { fillDemo('fayselsk@gmail.com'); });
    var fg = document.getElementById('az-fill-agent');
    if (fg) fg.addEventListener('click', function () { fillDemo('ranababu78@gmail.com'); });
    var su = root.querySelector ? root.querySelector('.az-signup') : null;
    if (su) su.addEventListener('click', openSignUp);
    var gu = root.querySelector ? root.querySelector('.az-guest') : null;
    if (gu) gu.addEventListener('click', function () {
      startSession({ e: '', r: 'USER', n: DEFAULT_ME.name, i: DEFAULT_ME.idNum, at: Date.now() });
    });
    var fp = root.querySelector ? root.querySelector('.az-forgot') : null;
    if (fp) fp.addEventListener('click', function () {
      openModal('<div class="az-mtop"><h3>\u{1F511} Forgot password</h3><button type="button" class="az-x" data-act="close">\u2715</button></div>' +
        '<p class="tip">Staff and agency passwords are reset by the AddaBuzz HQ admin (fayselsk@gmail.com). ' +
        'Viewer accounts reset through Firebase Auth in the Android app \u2014 this web mirror cannot mail a reset link.</p>');
    });
    root.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter') return;
      var id = e.target && e.target.id;
      if (id === 'az-email' || id === 'az-pass') { e.preventDefault(); doLogin(); }
      if (id === 'az-su-pass') { e.preventDefault(); doSignUp(); }
    });
  })();

  root.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('button,[data-room],[data-act]') : null;
    if (!t) return;
    var act = t.getAttribute('data-act');
    if (t.hasAttribute('data-room') && t.getAttribute('data-room')) {
      st.cur = t.getAttribute('data-room'); st.view = 'live'; st.sideRoom = ''; render(); return;
    }
    if (t.hasAttribute('data-filter')) { st.filter = t.getAttribute('data-filter'); render(); return; }
    if (t.hasAttribute('data-rank')) { st.rankType = t.getAttribute('data-rank'); render(); return; }
    if (t.hasAttribute('data-period')) { st.rankPeriod = t.getAttribute('data-period'); render(); return; }
    if (t.hasAttribute('data-tier')) { st.tier = parseInt(t.getAttribute('data-tier'), 10); openWallet('topup'); return; }
    if (t.hasAttribute('data-method')) { st.method = t.getAttribute('data-method'); openWallet('topup'); return; }
    if (t.hasAttribute('data-wp')) { st.wpreset = parseInt(t.getAttribute('data-wp'), 10); openWallet('withdraw'); return; }
    if (t.hasAttribute('data-wm')) { st.wmethod = t.getAttribute('data-wm'); openWallet('withdraw'); return; }
    if (t.hasAttribute('data-gift')) {
      var g = GIFTS[parseInt(t.getAttribute('data-gift'), 10)];
      closeModal(); sendChat('sent ' + g[0] + ' x1 (' + g[1] + ' coins)', g[2], g[1]); return;
    }
    if (t.hasAttribute('data-game')) { playGame(t.getAttribute('data-game')); return; }
    if (t.hasAttribute('data-view')) {
      st.view = t.getAttribute('data-view');
      render(); return;
    }
    if (!act) return;
    if (act === 'mdesktop' || act === 'mphone') { st.mode = act === 'mphone' ? 'phone' : 'desktop'; applyMode(); return; }
    if (act === 'home') { st.view = 'home'; render(); }
    else if (act === 'close') closeModal();
    else if (act === 'gifts') openGifts();
    else if (act === 'games') openGames();
    else if (act === 'topup') openWallet('topup');
    else if (act === 'withdraw') openWallet('withdraw');
    else if (act === 'rank') { st.view = 'rank'; render(); }
    else if (act === 'rankall') { st.view = 'rank'; render(); }
    else if (act === 'tasks') { st.view = 'messages'; render(); toast('Host tasks live in the app \u00b7 showing notifications'); }
    else if (act === 'boost') boostPK();
    else if (act === 'follow') toggleFollow();
    else if (act === 'like') likeBurst();
    else if (act === 'theme') toggleTheme();
    else if (act === 'dosignup') doSignUp();
    else if (act === 'signup') openSignUp();
    else if (act === 'logout') { endSession(); toast('Signed out \u00b7 sign in again to open the app'); }
    else if (act === 'accountlist') openAccounts();
    else if (act === 'pfnav:Security') openModal('<div class="az-mtop"><h3>\u{1F6E1}\uFE0F Security</h3>' +
        '<button type="button" class="az-x" data-act="close">\u2715</button></div><div class="az-kv">' +
        kv('E2EE chat', ME.e2eeEnabled ? 'on' : 'off') + kv('Two-factor', 'on') + kv('Role', ME.role) +
        kv('Agency', ME.agencyName) + kv('Agency code', ME.agencyCode) + kv('Data backup', 'auto \u00b7 asia-south1') + '</div>');
    else if (act.indexOf('pfnav:') === 0) toast(act.slice(6) + ' \u00b7 live in the Android build');
    else if (act.indexOf('gtype:') === 0) { st.gtype = parseInt(act.slice(6), 10) || 0; render(); }
    else if (act.indexOf('gq:') === 0) { st.gq = parseInt(act.slice(3), 10) || 0; render(); }
    else if (act === 'studio-reload') { loadStudio(); toast('Reloading studio options from Firestore\u2026'); }
    else if (act === 'golive-demo') {
      var gt = studio && studio.types[st.gtype];
      var gq = studio && studio.quals[st.gq];
      toast((gt ? gt.label : 'BROADCAST') + ' \u00b7 ' + (gq ? gq.label : 'preview') +
        ' \u00b7 room doc not written from this mirror');
    }
    else if (act === 'pay') { var s = TIERS[st.tier]; st.coins += s[0] + s[1]; renderWallet(); closeModal(); toast('Paid \u09F3' + money(s[3]) + ' \u00b7 +' + money(s[0] + s[1]) + ' coins'); }
    else if (act === 'confirmw') { var w = WPRESETS[st.wpreset]; if (st.points < w[0]) { toast('Not enough points'); return; } st.points -= w[0]; renderWallet(); closeModal(); toast('Withdrawal of \u09F3' + money(w[1] * 120) + ' queued via ' + st.wmethod); }
  });

  root.addEventListener('submit', function (e) {
    if (e.target && e.target.id === 'az-form') {
      e.preventDefault();
      var inp = document.getElementById('az-text');
      var txt = (inp.value || '').trim();
      if (!txt) return;
      inp.value = '';
      sendChat(txt, '', 0);
    }
  });

  root.addEventListener('click', function (e) {
    var q = e.target.closest ? e.target.closest('#az-quick button') : null;
    if (!q) return;
    var holder = document.getElementById('az-quick');
    var picks = holder && holder._picks;
    if (!picks) return;
    var g = picks[parseInt(q.getAttribute('data-gi'), 10)];
    sendChat('sent ' + g[0] + ' x1 (' + g[1] + ' coins)', g[2], g[1]);
  });

  root.addEventListener('mousedown', function (e) {
    var sc = e.target.closest ? e.target.closest('#az-stage') : null;
    if (sc && !(e.target.closest('[data-act]') || e.target.closest('button'))) likeBurst();
  });

  function likeBurst() {
    st.likes++;
    var h = document.getElementById('az-hearts');
    if (h) { h.className = 'az-hearts'; void h.offsetWidth; h.className = 'az-hearts go'; }
  }

  var scrim = document.getElementById('az-scrim');
  if (scrim) scrim.addEventListener('click', closeModal);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });

  setInterval(function () { if (st.pkTimer > 0) { st.pkTimer--; if (st.view === 'live') { var pk = document.querySelector('#abzapp .az-pk .sub'); if (pk) { var mm = Math.floor(st.pkTimer / 60), ss = st.pkTimer % 60; var r = roomById(st.cur); if (r && r.pkBattle) pk.innerHTML = 'vs ' + esc(r.pkBattle.opponentName || 'rival') + ' \u00b7 \u23F1 ' + (mm < 10 ? '0' : '') + mm + ':' + (ss < 10 ? '0' : '') + ss + (r.pkBattle.punishmentText ? ' \u00b7 ' + esc(r.pkBattle.punishmentText) : ''); } } } }, 1000);

  try {
    var savedMode = localStorage.getItem('abzmode');
    st.mode = (savedMode === 'phone' || savedMode === 'desktop') ? savedMode : (window.innerWidth >= 760 ? 'desktop' : 'phone');
  } catch (e) { st.mode = window.innerWidth >= 760 ? 'desktop' : 'phone'; }
  applyMode();
  try { st.theme = localStorage.getItem('abztheme') === 'neon' ? 'neon' : 'dark'; } catch (e) { st.theme = 'dark'; }
  if (st.theme === 'neon') { var az = document.getElementById('abzapp'); if (az && az.classList) az.classList.add('neon'); }
  window.addEventListener('resize', applyMode);

  paintIcons();
  var session = null;
  try { session = JSON.parse(localStorage.getItem('abzauth')); } catch (e) { session = null; }
  if (session && session.n && (session.r === 'ADMIN' || session.r === 'SUPER_AGENT' || session.r === 'USER')) {
    applySession(session);
  } else {
    try { localStorage.removeItem('abzauth'); } catch (e) {}
  }

  loadRooms();
  loadStudio();
  setInterval(loadRooms, 4000);
  setInterval(function () { if (st.view === 'live' && st.cur) loadChat(); }, 6000);
})();
</script>

</body>
</html>
