  function val(x) {
    if (x === null || x === undefined) return null;
    if ('stringValue' in x) return x.stringValue;
    if ('integerValue' in x) return parseInt(x.integerValue, 10);
    if ('doubleValue' in x) return x.doubleValue;
    if ('booleanValue' in x) return x.booleanValue;
    if ('arrayValue' in x) { var a = x.arrayValue.values || [], o = []; for (var i = 0; i < a.length; i++) o.push(val(a[i])); return o; }
    if ('mapValue' in x) return unmap(x.mapValue.fields);
    if ('timestampValue' in x) return x.timestampValue;
    return null;
  }
  function unmap(f) { var o = {}; if (f) { for (var k in f) if (f.hasOwnProperty(k)) o[k] = val(f[k]); } return o; }
  function idOf(n) { var p = String(n).split('/'); return p[p.length - 1]; }
  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function fmt(n) {
    if (typeof n === 'string') {
      var s = n.replace(/[^0-9.KkMm]/g, '').slice(0, 10);
      return s || '0';
    }
    n = Number(n) || 0;
    if (n >= 1000000) return (n / 1000000).toFixed(1).replace('.0', '') + 'M';
    if (n >= 1000) return (n / 1000).toFixed(1).replace('.0', '') + 'K';
    return String(n);
  }
  function money(n) { return (Number(n) || 0).toLocaleString('en-US'); }
  function getJSON(url, cb) {
    try {
      fetch(url, { method: 'GET', headers: { Accept: 'application/json' } })
        .then(function (r) { return r.json(); })
        .then(function (d) { cb(null, d); })
        .catch(function (e) { cb(e, null); });
    } catch (e) { cb(e, null); }
  }
  function write(url, method, payload, cb) {
    try {
      fetch(url, { method: method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
        .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('http ' + r.status)); })
        .then(function (d) { cb && cb(null, d); })
        .catch(function (e) { cb && cb(e, null); });
    } catch (e) { cb && cb(e, null); }
  }

  /* The document API takes the update mask as query params, not in the body. */
  function patchUrl(url, paths) {
    var q = [];
    for (var i = 0; i < paths.length; i++) q.push('updateMask.fieldPaths=' + encodeURIComponent(paths[i]));
    return url + (url.indexOf('?') >= 0 ? '&' : '?') + q.join('&');
  }
  function numField(name, value) { var p = {}; p[name] = { integerValue: String(value) }; return p; }
  function fv(v) {
    if (typeof v === 'boolean') return { booleanValue: v };
    if (typeof v === 'number') return v % 1 === 0 ? { integerValue: String(v) } : { doubleValue: v };
    if (v && typeof v === 'object') {
      if (Object.prototype.toString.call(v) === '[object Array]') {
        var arr = [];
        for (var i = 0; i < v.length; i++) arr.push(fv(v[i]));
        return { arrayValue: { values: arr } };
      }
      return { mapValue: { fields: encodeFields(v) } };
    }
    return { stringValue: String(v === undefined || v === null ? '' : v) };
  }
  function encodeFields(o) {
    var p = {};

  function bump(field, delta) {
    if (!st.cur) return;
    var r = roomById(st.cur) || {};
    var stored = Number(r[field]);
    if (!isFinite(stored)) return;
    var next = Math.max(0, stored + delta);
    r[field] = next;
    if (st.view === 'live') renderStage();
    write(patchUrl(ROOMS + '/' + st.cur + '?key=' + KEY, [field]), 'PATCH',
      { fields: numField(field, next) }, function (err) { if (err) writeFail(); else loadRooms(); });
  }

    if (st.coins < cost) { toast('Need ' + cost + ' coins to boost'); openWallet('topup'); return; }
    spendCoins(cost);
    bumpStat('boosts', 1);
    var next = (Number(r.pkBattle.leftScore) || 0) + cost;
    var merged = {}, key;
    for (key in r.pkBattle) if (r.pkBattle.hasOwnProperty(key)) merged[key] = r.pkBattle[key];
    merged.leftScore = next;
    r.pkBattle = merged;
    renderStage();
    write(patchUrl(ROOMS + '/' + st.cur + '?key=' + KEY, ['pkBattle']), 'PATCH',
      { fields: { pkBattle: { mapValue: { fields: encodeFields(merged) } } } },
      function (err) { if (err) writeFail(); else loadRooms(); });

  function rankData() {
    var out = [], i;
    if (st.rankType === 'charm') {
      for (i = 0; i < st.rooms.length; i++) {
        var r = st.rooms[i];
        out.push({ name: r.name || 'host', sub: (r.category || 'chat') + ' \u00b7 Lv.' + (r.level || 1), score: Number(r.charmScore) || 0, avatar: r.imageUrl || '', docId: r.docId });
      }
      out.sort(function (a, b) { return b.score - a.score; });
      return out;
    }
    for (i = 0; i < STAR.length; i++) {
      var s = STAR[i];
      var mult = st.rankType === 'wealth' ? (1 + s[4] / 100) : 1;
      var scale = st.rankPeriod === 'Daily' ? 0.06 : (st.rankPeriod === 'Weekly' ? 0.25 : (st.rankPeriod === 'Monthly' ? 0.6 : 1));
      out.push({ name: s[0], sub: s[1] + ' \u00b7 Lv.' + s[4], score: Math.round(s[2] * mult * scale),

    return out;
  }

  function copyText(txt, msg) {
    var ok = function () { toast(msg || 'Copied to clipboard'); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(ok, function () { legacyCopy(txt, ok); });
    } else legacyCopy(txt, ok);
  }
  function legacyCopy(txt, ok) {
    var ta = document.createElement('textarea');
    ta.value = txt; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta); ta.select();
    try { if (document.execCommand('copy')) ok(); else toast('Copy blocked \u00b7 ' + txt); }
    catch (e) { toast('Copy blocked \u00b7 ' + txt); }
    document.body.removeChild(ta);
  }

      studio = { types: types, def: o.defaults || {}, at: o.updatedAt || '' };
      if (!types.length) st.gtype = 0;
      if (st.gtype >= types.length) st.gtype = Math.max(0, types.length - 1);
      if (st.view === 'golive') render();
    });

    else if (st.view === 'live') v.innerHTML = viewLive();
    else if (st.view === 'rank') v.innerHTML = viewRank();
    else if (st.view === 'messages') v.innerHTML = viewMessages();
    else if (st.view === 'profile') v.innerHTML = viewProfile();
    else v.innerHTML = viewGolive();

    var side = document.getElementById('az-side');
    if (st.view === 'live') {
      if (st.sideRoom !== st.cur) { st.sideRoom = st.cur; side.innerHTML = sideForChat(); buildQuick(); loadChat(); }

      st.sideRoom = '';

  function playGame(kind) {
    var cost = kind === 'wheel' ? 50 : (kind === 'mines' ? 100 : 200);
    if (st.coins < cost) { toast(T('Not enough coins')); openWallet('topup'); return; }
    spendCoins(cost);
    var win = Math.random() < 0.35 ? cost * (2 + Math.floor(Math.random() * 5)) : 0;
    if (win) earnCoins(win);
    PF.stats.games = (Number(PF.stats.games) || 0) + 1;
    PF.stats.spent = (Number(PF.stats.spent) || 0) + cost;
    savePF();
    closeModal();
    toast(win ? '\u{1F3B6} You won \u{1F7E1} ' + money(win) : 'No luck this time \u00b7 \u2212' + money(cost));
  }

      eye.setAttribute('aria-label', reveal ? 'Hide password' : 'Show password');
    });

    if (fa) fa.addEventListener('click', function () { fillDemo('fayselsk@gmail.com'); });
    var fg = document.getElementById('az-fill-agent');
    if (fg) fg.addEventListener('click', function () { fillDemo('ranababu78@gmail.com'); });
    var su = root.querySelector ? root.querySelector('.az-signup') : null;
    if (su) su.addEventListener('click', openSignUp);
    var gu = root.querySelector ? root.querySelector('.az-guest') : null;
    if (gu) gu.addEventListener('click', function () {
      startSession({ e: '', r: 'USER', n: DEFAULT_ME.name, i: DEFAULT_ME.idNum, at: Date.now() });
    });
    var fp = root.querySelector ? root.querySelector('.az-forgot') : null;
    if (fp) fp.addEventListener('click', function () {

        '<p class="tip">Staff and agency passwords are reset by the AddaBuzz HQ admin (fayselsk@gmail.com). ' +
        'Viewer passwords reset from the Sign Up screen on this device \u2014 no reset mail is sent.</p>');
    });
    root.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter') return;
      var id = e.target && e.target.id;
      if (id === 'az-email' || id === 'az-pass') { e.preventDefault(); doLogin(); }
      if (id === 'az-su-pass') { e.preventDefault(); doSignUp(); }
    });
  })();

  root.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('button,[data-room],[data-act]') : null;
    if (!t) return;
    var act = t.getAttribute('data-act');
    if (t.hasAttribute('data-room') && t.getAttribute('data-room')) {
      st.cur = t.getAttribute('data-room'); st.view = 'live'; st.sideRoom = '';
      st.seatIdx = 0; st.hand = false; st.mute = false; st.audioOnly = !!PF && PF.audioOnly;
      var openRoom = roomById(st.cur);
      if (openRoom && openRoom.pkBattle) st.pkTimer = Math.max(0, Number(openRoom.pkBattle.timeLeftSeconds) || 0);
      render(); rocketFx(); return;
    }
    if (t.hasAttribute('data-filter')) { st.filter = t.getAttribute('data-filter'); render(); return; }
    if (t.hasAttribute('data-rank')) { st.rankType = t.getAttribute('data-rank'); render(); return; }
    if (t.hasAttribute('data-period')) { st.rankPeriod = t.getAttribute('data-period'); render(); return; }
    if (t.hasAttribute('data-tier')) { st.tier = parseInt(t.getAttribute('data-tier'), 10); openWallet('topup'); return; }
    if (t.hasAttribute('data-method')) { st.method = t.getAttribute('data-method'); openWallet('topup'); return; }
    if (t.hasAttribute('data-wp')) { st.wpreset = parseInt(t.getAttribute('data-wp'), 10); openWallet('withdraw'); return; }
    if (t.hasAttribute('data-wm')) { st.wmethod = t.getAttribute('data-wm'); openWallet('withdraw'); return; }
    if (t.hasAttribute('data-gift')) {
      var g = GIFTS[parseInt(t.getAttribute('data-gift'), 10)];
      closeModal(); sendChat('sent ' + g[0] + ' x1 (' + g[1] + ' coins)', g[2], g[1]); return;
    }
    if (t.hasAttribute('data-game')) { playGame(t.getAttribute('data-game')); return; }
    if (t.hasAttribute('data-view')) {
      st.view = t.getAttribute('data-view');
      render(); return;
    }
    if (!act) return;
    if (act === 'mdesktop' || act === 'mphone') { st.mode = act === 'mphone' ? 'phone' : 'desktop'; applyMode(); return; }
    if (act === 'home') { st.view = 'home'; render(); }
    else if (act === 'close') closeModal();
    else if (act === 'gifts') openGifts();
    else if (act === 'games') openGames();
    else if (act === 'topup') openWallet('topup');
    else if (act === 'withdraw') openWallet('withdraw');
    else if (act === 'rank') { st.view = 'rank'; render(); }
    else if (act === 'rankall') { st.view = 'rank'; render(); }
    else if (act === 'tasks') openTasks();
    else if (act === 'boost') boostPK();
    else if (act === 'follow') toggleFollow();
    else if (act === 'like') likeBurst();
    else if (act === 'theme') toggleTheme();
    else if (act === 'dosignup') doSignUp();
    else if (act === 'signup') openSignUp();
    else if (act === 'logout') { endSession(); toast('Signed out \u00b7 sign in again to open the app'); }
    else if (act === 'accountlist') openAccounts();
    else if (act === 'pfnav:Security') openSecurity();
    else if (act === 'sec:e2ee') { PF.e2ee = !PF.e2ee; ME.e2eeEnabled = PF.e2ee; savePF(); openSecurity(); toast('End-to-end chat ' + (PF.e2ee ? 'on' : 'off')); }
    else if (act === 'sec:twof') { PF.twof = !PF.twof; savePF(); openSecurity(); toast('Two-factor ' + (PF.twof ? 'on' : 'off')); }
    else if (act === 'sec:public') { PF.publicProfile = PF.publicProfile === false; savePF(); openSecurity(); toast('Public room list \u00b7 ' + (PF.publicProfile ? 'visible' : 'hidden')); }
    else if (act === 'dlbackup') downloadBackup();
    else if (act === 'wipe') wipeDevice();
    else if (act.indexOf('pfnav:') === 0) openPfnav(act.slice(6));
    else if (act.indexOf('gtype:') === 0) { st.gtype = parseInt(act.slice(6), 10) || 0; render(); }
    else if (act === 'studio-reload') { loadStudio(); toast('Reloading studio options\u2026'); }
    else if (act === 'golive-open') openLiveSetup();
    else if (act === 'livego') startLive();
    else if (act === 'livestop') stopLive();
    else if (act === 'ltitle') openLiveTitle();
    else if (act === 'savelivetitle') saveLiveTitle();
    else if (act === 'lshare') copyRoomLink();
    else if (act === 'lboost') boostLivePK();
    else if (act.indexOf('lseat:') === 0) takeLiveSeat(parseInt(act.slice(6), 10) || 1);
    else if (act === 'sound') { st.mute = !st.mute; renderStage(); toast(st.mute ? '\u{1F507} Stream muted' : '\u{1F50A} Stream sound on'); }
    else if (act === 'audioroom') { st.audioOnly = true; if (PF) { PF.audioOnly = true; savePF(); } renderStage(); toast('\u{1F3A7} Audio-only view \u00b7 saves data'); }
    else if (act === 'videoroom') { st.audioOnly = false; if (PF) { PF.audioOnly = false; savePF(); } renderStage(); toast('\u{1F4F9} Camera feed back on'); }
    else if (act === 'mic') { toggleMic(); if (PF && !st.live) { PF.mic = st.mic; savePF(); } }
    else if (act === 'cam') { toggleCam(); if (PF) { PF.cam = st.cam; savePF(); } }
    else if (act.indexOf('seat:') === 0) takeSeat(parseInt(act.slice(5), 10) || 1);
    else if (act === 'seatinvite' || act === 'shareroom') copyRoomLink();
    else if (act === 'raise') { st.hand = !st.hand; renderStage(); toast(st.hand ? '\u270B Hand raised \u00b7 you are first in the queue' : '\u2748 Hand lowered'); }
    else if (act === 'report') openReport();
    else if (act.indexOf('rep:') === 0) sendReport(parseInt(act.slice(4), 10) || 0);
    else if (act.indexOf('buy:') === 0) buyItem(parseInt(act.slice(4), 10));
    else if (act.indexOf('gear:') === 0) setGear(act.slice(5));
    else if (act === 'use:charm') useCharmCard();
    else if (act.indexOf('claim:') === 0) claimTask(parseInt(act.slice(6), 10));
    else if (act.indexOf('honclaim:') === 0) claimHonor(parseInt(act.slice(9), 10));
    else if (act.indexOf('rwclaim:') === 0) claimReward(parseInt(act.slice(8), 10));
    else if (act.indexOf('claiminv:') === 0) claimInvite(parseInt(act.slice(9), 10));
    else if (act.indexOf('club:') === 0) toggleClub(act.slice(5));
    else if (act.indexOf('medal:') === 0) medalInfo(parseInt(act.slice(6), 10));
    else if (act === 'copycode') copyText(inviteCode(), 'Invite code copied');
    else if (act === 'copylink') copyText('https://addabuzzlive.blogspot.com/?ref=' + encodeURIComponent(inviteCode()), 'Invite link copied');
    else if (act === 'sharewa') window.open('https://wa.me/?text=' + encodeURIComponent('Join me on AddaBuzz Live \u00b7 my invite code is ' + inviteCode()), '_blank');
    else if (act === 'addinv') addInvite();
    else if (act === 'saveinv') saveInvite();
    else if (act === 'savepf') saveProfile();
    else if (act.indexOf('setgender:') === 0) { PF.gender = act.slice(10) === 'FEMALE' ? 'FEMALE' : 'MALE'; savePF(); openEditProfile(); }
    else if (act.indexOf('setav:') === 0) { PF.av = parseInt(act.slice(6), 10) || 0; savePF(); applyPF(); openEditProfile(); render(); }
    else if (act.indexOf('lang:') === 0) setLang(act.slice(5));
    else if (act.indexOf('hosg:') === 0) { PF.hosG = act.slice(5) === 'FEMALE' ? 'FEMALE' : 'MALE'; savePF(); openAddHost(); }
    else if (act === 'savehost') saveHost();
    else if (act.indexOf('agprom:') === 0) promoteAgent(parseInt(act.slice(7), 10));
    else if (act.indexOf('agsus:') === 0) suspendAgent(parseInt(act.slice(7), 10));
    else if (act === 'geninvite') genInvite();
    else if (act === 'copyinvite') {
      var iv = PF.invites[PF.invites.length - 1];
      if (!iv) toast('Generate a code first'); else copyText(iv.c, 'Invite code copied');
    } else if (act.indexOf('delinvite:') === 0) { PF.invites.splice(parseInt(act.slice(10), 10), 1); savePF(); openInviteAgent(); }
    else if (act.indexOf('tr:') === 0) { var trp = act.split(':'); doTrade(trp[1], parseInt(trp[2], 10)); }
    else if (act.indexOf('rkmetric:') === 0) { st.rkMetric = act.slice(9) === 'hosts' ? 'hosts' : 'pts'; openAgentRanking(); }
    else if (act.indexOf('payout:') === 0) { PF.payout = act.slice(7); savePF(); openDiamondAgent(); toast('Payout method \u00b7 ' + PF.payout); }
    else if (act === 'sendapply') sendApply();
    else if (act === 'cancelapply') cancelApply();
    else if (act === 'pay') {
      var s = TIERS[st.tier];
      PF.stats.topups = (Number(PF.stats.topups) || 0) + 1;
      earnCoins(s[0] + s[1]); closeModal();
      toast('Paid \u09F3' + money(s[3]) + ' \u00b7 +' + money(s[0] + s[1]) + ' coins');
    }
    else if (act === 'confirmw') {
      var w = WPRESETS[st.wpreset];
      if (st.points < w[0]) { toast('Not enough points'); return; }
      st.points -= w[0]; PF.points = st.points; savePF(); renderWallet(); closeModal();
      toast('Withdrawal of \u09F3' + money(w[1] * 120) + ' queued via ' + st.wmethod);
    }
  });

  root.addEventListener('submit', function (e) {
    if (e.target && e.target.id === 'az-form') {
      e.preventDefault();
      var inp = document.getElementById('az-text');
      var txt = (inp.value || '').trim();
      if (!txt) return;
      inp.value = '';
      sendChat(txt, '', 0);
    }
  });

  root.addEventListener('click', function (e) {
    var q = e.target.closest ? e.target.closest('#az-quick button') : null;
    if (!q) return;
    var holder = document.getElementById('az-quick');
    var picks = holder && holder._picks;
    if (!picks) return;
    var g = picks[parseInt(q.getAttribute('data-gi'), 10)];
    sendChat('sent ' + g[0] + ' x1 (' + g[1] + ' coins)', g[2], g[1]);
  });

  root.addEventListener('mousedown', function (e) {
    var sc = e.target.closest ? e.target.closest('#az-stage') : null;
    if (sc && !(e.target.closest('[data-act]') || e.target.closest('button'))) likeBurst();
  });

  function likeBurst() {
    st.likes++;
    bumpStat('likes', 1);
    var h = document.getElementById('az-hearts');
    if (h) { h.className = 'az-hearts'; void h.offsetWidth; h.className = 'az-hearts go'; }
  }

  var scrim = document.getElementById('az-scrim');
  if (scrim) scrim.addEventListener('click', closeModal);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });

  setInterval(function () {
    if (st.view !== 'live' || st.pkTimer <= 0) return;
    st.pkTimer--;
    var el = document.getElementById('az-pktime');
    if (el) el.textContent = '\u23F1 ' + clock(st.pkTimer);
    if (st.pkTimer === 0) renderStage();
  }, 1000);

  try {
    var savedMode = localStorage.getItem('abzmode');
    st.mode = (savedMode === 'phone' || savedMode === 'desktop') ? savedMode : (window.innerWidth >= 760 ? 'desktop' : 'phone');
  } catch (e) { st.mode = window.innerWidth >= 760 ? 'desktop' : 'phone'; }
  applyMode();
  try { st.theme = localStorage.getItem('abztheme') === 'neon' ? 'neon' : 'dark'; } catch (e) { st.theme = 'dark'; }
  if (st.theme === 'neon') { var az = document.getElementById('abzapp'); if (az && az.classList) az.classList.add('neon'); }
  window.addEventListener('resize', applyMode);

  paintIcons();
  var session = null;
  try { session = JSON.parse(localStorage.getItem('abzauth')); } catch (e) { session = null; }
  if (session && session.n && (session.r === 'ADMIN' || session.r === 'SUPER_AGENT' || session.r === 'USER')) {
    applySession(session);
  } else {
    try { localStorage.removeItem('abzauth'); } catch (e) {}
    loadPF(); applyPF(); render();
  }
  applyLang();

  setInterval(function () {
    if (!st.live) return;
    var secs = Math.floor((Date.now() - st.live.at) / 1000), k = st.live.kind || 'video';
    st.live.viewers += (secs % 4 === 0 ? 1 : 0);
    st.live.charm += 7;
    if (k === 'pk' && st.live.pk && st.live.pk.end > Date.now()) st.live.pk.right += 11;
    if (st.view !== 'golive' || secs % (k === 'pk' ? 1 : 5) !== 0) return;
    var v = document.getElementById('az-view');
    if (v) v.innerHTML = viewGolive();
  }, 1000);

  loadRooms();
  loadStudio();
  setInterval(loadRooms, 4000);
  setInterval(function () { if (st.view === 'live' && st.cur) loadChat(); }, 6000);
})();
</script>

</body>
</html>
